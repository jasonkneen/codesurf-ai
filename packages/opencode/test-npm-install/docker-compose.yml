services:
  test:
    build: .
    volumes:
      # Mount the dist folder containing built packages
      - ../dist:/packages:ro
    environment:
      - npm_config_registry=https://registry.npmjs.org/

  # Interactive shell for manual testing
  shell:
    build: .
    volumes:
      - ../dist:/packages:ro
    stdin_open: true
    tty: true
    entrypoint: /bin/bash
